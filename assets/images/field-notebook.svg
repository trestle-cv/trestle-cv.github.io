38c">OBSERVATIONS</text><text x="280" y="234" font-family="Georgia,serif" font-size="29" fill="#ecebdc">18</text><text x="480" y="199" font-size="11" letter-spacing="1" fill="#9ba38c">NEEDS WATCH</text><text x="480" y="234" font-family="Georgia,serif" font-size="29" fill="#ecebdc">4</text><text x="700" y="199" font-size="11" letter-spacing="1" fill="#9ba38c">FIELD CONDITIONS</text><text x="700" y="234" font-family="Georgia,serif" font-size="29" fill="#ecebdc">Cool · light rain</text><path d="M280 263h872" stroke="#3d4632"/><g fill="#20251a" stroke="#3d4632"><rect x="280" y="305" width="420" height="145"/><rect x="718" y="305" width="434" height="145"/><rect x="280" y="468" width="420" height="145"/><rect x="718" y="468" width="434" height="145"/></g><g stroke-width="4"><path d="M280 326v44" stroke="#b4cf8b"/><path d="M718 326v44" stroke="#d78958"/><path d="M280 489v44" stroke="#b4cf8b"/><path d="M718 489v44" stroke="#e27863"/></g><g font-family="monospace" font-size="10" font-weight="700" letter-spacing="1"><text x="304" y="334" fill="#b4cf8b">FLORA · STABLE</text><text x="742" y="334" fill="#d78958">WEATHER · WATCH</text><text x="304" y="497" fill="#b4cf8b">FAUNA · STABLE</text><text x="742" y="497" fill="#e27863">TERRAIN · CRITICAL</text></g><g font-family="Georgia,serif" font-size="22" fill="#ecebdc"><text x="304" y="379">Wattle flowering early</text><text x="742" y="379">Creek level rising</text><text x="304" y="542">Superb fairywren pair</text><text x="742" y="542">Track washout</text></g><g font-size="12" fill="#9ba38c"><text x="304" y="410">North ridge · 16.8°C</text><text x="742" y="410">Eastern crossing · 14.2°C</text><text x="304" y="573">Lower meadow</text><text x="742" y="573">Gully approach</text></g></g></svg>
